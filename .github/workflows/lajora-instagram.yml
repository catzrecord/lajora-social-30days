name: Lajora Instagram Cloud Publisher

on:
  schedule:
    # Once daily at 17:17 WIB.
    # GitHub cron uses UTC; WIB is UTC+7 and has no daylight-saving shift.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify the connection or publish a queue item"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - preflight
          - deploy
          - due
          - publish-id
      post_id:
        description: "Queue ID used only with publish-id"
        required: false
        type: string
      force_token_refresh:
        description: "Rotate and persist the renewable Meta token during this run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lajora-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_TOKEN_ENCRYPTION_KEY: ${{ secrets.META_TOKEN_ENCRYPTION_KEY }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      PUBLIC_ASSET_BASE_URL: ${{ secrets.PUBLIC_ASSET_BASE_URL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      META_GRAPH_HOST: ${{ vars.META_GRAPH_HOST }}
      META_DISCLOSE_AI: "true"
      META_TOKEN_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_token_refresh || 'false' }}
      LAJORA_PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'due' || inputs.mode }}
      LAJORA_POST_ID: ${{ inputs.mode == 'publish-id' && inputs.post_id || '' }}

    steps:
      - name: Check out the queue
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate cloud configuration
        shell: bash
        run: |
          test -n "$META_ACCESS_TOKEN"
          test -n "$META_TOKEN_ENCRYPTION_KEY"
          test -n "$INSTAGRAM_USER_ID"
          test -n "$PUBLIC_ASSET_BASE_URL"

      - name: Prepare renewable Meta token
        id: token
        run: node scripts/prepare_meta_token.mjs

      - name: Verify or publish
        id: publisher
        run: node scripts/publish_due.mjs

      - name: Rebuild the public queue dashboard
        if: contains(fromJSON('["published","already_published","deploy_ready"]'), steps.publisher.outputs.result)
        run: npm run build

      - name: Save the publishing ledger
        if: steps.token.outputs.state_changed == 'true' || contains(fromJSON('["published","already_published","deploy_ready"]'), steps.publisher.outputs.result)
        shell: bash
        env:
          PUBLISH_RESULT: ${{ steps.publisher.outputs.result }}
          POST_ID: ${{ steps.publisher.outputs.post_id }}
        run: |
          git config user.name "lajora-publisher[bot]"
          git config user.email "lajora-publisher@users.noreply.github.com"
          git add .state/meta-token.enc
          if [[ "$PUBLISH_RESULT" == "published" || "$PUBLISH_RESULT" == "already_published" || "$PUBLISH_RESULT" == "deploy_ready" ]]; then
            git add content-plan.json public/content-plan.json public/index.html
          fi
          git diff --cached --quiet && exit 0
          if [[ "$PUBLISH_RESULT" == "published" || "$PUBLISH_RESULT" == "already_published" ]]; then
            git commit -m "chore: record Instagram post $POST_ID"
          else
            git commit -m "chore: persist renewable Instagram token state"
          fi
          git push

      - name: Deploy the refreshed dashboard
        if: contains(fromJSON('["published","already_published","deploy_ready"]'), steps.publisher.outputs.result)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@54.20.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lajora Instagram publisher"
            echo "- Result: \`${{ steps.publisher.outputs.result || 'workflow_failed' }}\`"
            echo "- Post ID: \`${{ steps.publisher.outputs.post_id || '-' }}\`"
            echo "- Instagram: ${{ steps.publisher.outputs.instagram_url || '-' }}"
            echo "- Account: \`${{ steps.publisher.outputs.username || '-' }}\`"
            echo "- Token: \`${{ steps.token.outputs.refresh_status || 'not_checked' }}\`"
            echo "- Token lifetime: \`${{ steps.token.outputs.expires_in_days || '-' }} days\`"
          } >> "$GITHUB_STEP_SUMMARY"

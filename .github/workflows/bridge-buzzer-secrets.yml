name: Temporary Buzzer secret bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - name: Copy encrypted publisher configuration
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$META_ACCESS_TOKEN"
          printf '%s' "$META_ACCESS_TOKEN" | gh secret set META_ACCESS_TOKEN -R catzrecord/buzzer-klip-social-100d
          printf '%s' '15363714685' | gh secret set INSTAGRAM_USER_ID -R catzrecord/buzzer-klip-social-100d
          printf '%s' 'https://catzrecord.github.io/buzzer-klip-social-100d' | gh secret set PUBLIC_ASSET_BASE_URL -R catzrecord/buzzer-klip-social-100d
          gh variable set META_GRAPH_HOST --body 'graph.instagram.com' -R catzrecord/buzzer-klip-social-100d
          gh variable set META_GRAPH_VERSION --body 'v25.0' -R catzrecord/buzzer-klip-social-100d
          echo 'Buzzer encrypted configuration copied.'
